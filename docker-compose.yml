# rn-agent-os — Phase 0 local dev stack.
# Bring up: docker compose up -d   (schema auto-loads into Postgres)
version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentos}
      POSTGRES_DB: ${POSTGRES_DB:-agentos}
    ports: ["5432:5432"]
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-agentos}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-agentos123}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]

  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-change-me}
    ports: ["5678:5678"]
    depends_on: [db]
    volumes: [n8n_data:/home/node/.n8n]

  metabase:
    image: metabase/metabase:latest
    ports: ["3000:3000"]
    depends_on: [db]

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-agentos}:${POSTGRES_PASSWORD:-agentos}@db:5432/${POSTGRES_DB:-agentos}
      BACKEND: postgres
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
    ports: ["8000:8000"]
    depends_on: [db, ollama, redis]

  # placeholders for later: qdrant, vllm, openhands, appsmith/tooljet

volumes:
  db_data:
  minio_data:
  ollama_data:
  n8n_data:
